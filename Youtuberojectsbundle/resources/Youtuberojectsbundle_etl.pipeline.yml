# The main pipeline for Youtuberojectsbundle

resources:
  pipelines:
    Youtuberojectsbundle_etl:
      name: Youtuberojectsbundle_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: "../src/Youtuberojectsbundle_etl"

      libraries:
        - glob:
            include: ../src/Youtuberojectsbundle_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
