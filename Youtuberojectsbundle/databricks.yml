# This is a Databricks asset bundle definition for Youtuberojectsbundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Youtuberojectsbundle
  uuid: 92b72c6c-0b05-46f8-9e3e-5a2f5b20dcc4

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b5db4ead-422d.cloud.databricks.com
    variables:
      catalog: youtube_dev
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-b5db4ead-422d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pyspark6@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pyspark6@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: youtube_dev
      schema: prod
    permissions:
      - user_name: pyspark6@gmail.com
        level: CAN_MANAGE
